services:
  postgres:
    image: postgres:16
    container_name: riftdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: riftdb
      POSTGRES_PASSWORD: riftdb
      POSTGRES_DB: riftdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riftdb -d riftdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: riftdb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
